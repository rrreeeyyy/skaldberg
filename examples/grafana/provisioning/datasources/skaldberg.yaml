apiVersion: 1

datasources:
  # Skaldberg speaks the Prometheus HTTP API subset that Grafana's
  # built-in `prometheus` datasource expects (selectors, aggregations,
  # rate-family, histogram_quantile, vec×vec, topk — see the README's
  # "PromQL pushdown" section for the full list). Grafana doesn't
  # need to know the backend isn't Prometheus.
  - name: Skaldberg
    uid: skaldberg          # referenced by the provisioned dashboard
    type: prometheus
    access: proxy
    url: http://host.docker.internal:8080
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # If the server is started with --api-token / SKALDBERG_API_TOKEN,
      # add a custom Authorization header here (or via the UI on
      # first boot). Provisioning example:
      #   httpHeaderName1: Authorization
      # secureJsonData:
      #   httpHeaderValue1: "Bearer <token>"
