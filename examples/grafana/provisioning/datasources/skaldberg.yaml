apiVersion: 1

datasources:
  # Skaldberg speaks the Prometheus HTTP API subset (selectors +
  # range vectors; functions are parsed but unwrapped to raw points
  # in step 1). Grafana's built-in `prometheus` datasource type
  # talks to it as if it were a vanilla Prometheus server.
  - name: Skaldberg
    type: prometheus
    access: proxy
    url: http://host.docker.internal:8080
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # If the server is started with --api-token / SKALDBERG_API_TOKEN,
      # add a custom Authorization header here (or via the UI on
      # first boot). Provisioning example:
      #   httpHeaderName1: Authorization
      # secureJsonData:
      #   httpHeaderValue1: "Bearer <token>"
