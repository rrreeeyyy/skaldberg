[package]
name = "skaldberg-server"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "skaldberg-server"
path = "src/main.rs"

[dependencies]
# HTTP
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.4", features = ["limit"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 4: DataFusion replaces DuckDB. iceberg-datafusion bridges Iceberg
# tables into DataFusion's TableProvider so SQL queries see them
# transparently. iceberg-datafusion 0.9 pins datafusion ^52.2.
datafusion = "52.2"
iceberg = "0.9"
iceberg-catalog-s3tables = "0.9"
iceberg-datafusion = "0.9"

# We implement `iceberg::io::Storage` directly on top of aws-sdk-s3
# instead of going through `iceberg-storage-opendal`. The OpenDAL path
# uses `reqsign` for SigV4 signing, which has its own credential chain
# distinct from the AWS SDK's — making SSO / shared-profile / IRSA
# refresh awkward to plumb through. Going SDK-direct removes the
# bridge and keeps a single, well-known credential code path.
aws-config = "1"
aws-sdk-s3 = "1"
# `Storage` / `StorageFactory` are tagged with `#[typetag::serde]`; we
# need typetag visible to repeat that attribute on our impls.
typetag = "0.2"
bytes = "1"

# Arrow / Parquet are re-exported from datafusion, but a few of our modules
# (convert.rs, flush helpers) need the concrete types directly.
# Same major as iceberg/datafusion's transitive arrow.
arrow = "57"
parquet = "57"

# Phase 3 ingester: series_id derivation.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Phase 3 ingester: WAL record CRC.
crc32fast = "1"

# Phase 3.6 (Remote Write): protobuf decoding for Prometheus WriteRequest,
# and raw snappy decompression. The Prometheus remote_write protocol uses
# `application/x-protobuf` body, snappy-compressed (raw, not framed).
prost = "0.13"
snap = "1.1"

# async support for Iceberg catalog/writer traits
async-trait = "0.1"
futures = "0.3"

# Metrics: facade + Prometheus exposition. Counters and histograms are
# emitted via `metrics::{counter, histogram}` from the hot paths and
# scraped over `/metrics`.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Prometheus HTTP API adapter: parse PromQL into an AST and translate
# the supported subset (selectors + range vectors + offset; functions
# and aggregations are unwrapped to their inner selector for now)
# into Skaldberg SQL.
promql-parser = "0.8"
# Hand-roll the `match[]=...&match[]=...` query string for /api/v1/series
# (axum's Query extractor uses serde_urlencoded which doesn't
# collapse repeated keys into a Vec).
url = "2"

# Errors / time
anyhow = "1"
thiserror = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
# LTO disabled in Phase 4 to keep build times reasonable on a single core.
# Re-enable with `lto = "thin"` once we have CI / release infra that can
# afford the extra link time.
lto = false
